name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # a new push to the same branch cancels the previous, still-running check
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff
      - run: python -m ruff check .

  docs:
    name: records (gate --docs)
    runs-on: ubuntu-latest
    # CUT (disabled, not deleted) -- 0105-ruling.md sec5: one agent on one
    # machine, and the commit hook already refuses a commit or push whose
    # gate result is not fresh and GREEN, so this job's usual purpose --
    # catching what a contributor forgot to run -- has no contributor left
    # to catch. Its own failure record was git-topology noise wearing a CI
    # job's clothes (0042-ruling.md), never a defect the local gate missed.
    # NOTE, not covered by the fix: `--docs`-specific checks (defect front
    # matter, the generated index, cross-references, the migration dry run)
    # are NOT part of `tools/gate.py`'s bare/full-mode run, so cutting this
    # job means nothing currently runs them anywhere, local or CI -- flagged
    # in 0106-report.md, not re-decided here (0105 sec6: "a change to the
    # judge ... ruled here and not decided by Code").
    if: false
    # No app dependencies: every check in this lane reads FILES -- defect front
    # matter, the generated index, cross-references, and the gh commands the
    # migration would emit. It needs no Qt, no display and no pytest, so it is
    # its own job and finishes in seconds rather than riding on the test matrix.
    #
    # `gh` is NOT installed or called: `--dry-run` only PRINTS the commands, and
    # printing them is the check. That is the point of the dry run -- the claim
    # "this format is GitHub-ready" is verified on every push instead of on the
    # day someone finally migrates.
    #
    # `Docs-Snapshot`, one of the checks `--docs` runs, self-skips here on a
    # `pull_request` trigger (0042-ruling.md): no workflow change needed for
    # that, since GitHub Actions already exports `GITHUB_EVENT_NAME` to every
    # step, and `tools/gate.py`'s `_snapshot_check()` reads it directly. The
    # rest of this job's checks (defect records, the index, cross-references,
    # the migration dry run) are unaffected and still run on every trigger.
    steps:
      - uses: actions/checkout@v5
        with:
          # closed_by is validated with `git cat-file`, so the commits those
          # records name have to be in the clone. The default depth of 1 is not
          # enough and would fail a record that is perfectly correct.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python tools/gate.py --docs

  test:
    # THE ONE SURVIVING pytest JOB -- 0105-ruling.md sec5: with one agent on
    # one machine, CI's remaining value is not catching what a contributor
    # forgot to run (there is no contributor); it is being the one run that
    # starts from a clean checkout and cannot be bypassed by
    # `--no-verify` on the machine it is checking (sec4). So it now runs the
    # SAME full gate the commit/push hook requires locally -- OFF, ON and
    # DEEP in one call -- rather than reimplementing a subset of it, which
    # also makes the old `deep` job (below, cut) redundant.
    name: pytest (py${{ matrix.python-version }}, full gate)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 IS STILL LISTED, NOT DELETED -- 0105-ruling.md sec5's "disable,
        # do not delete". Disabled below by a per-step `if:` (a job-level
        # `if:` cannot read `matrix` here -- confirmed empirically: it failed
        # the whole workflow file at parse time, before any job ran, on the
        # first attempt); re-enabling 3.10 is deleting that one condition
        # from every step. requires-python was raised to >=3.13 alongside
        # this cut (pyproject.toml) -- a repo must not promise a version it
        # no longer tests.
        python-version: ["3.10", "3.13"]
    env:
      # the suite is headless; conftest also sets this, but be explicit for CI
      QT_QPA_PLATFORM: offscreen
    steps:
      - if: matrix.python-version == '3.13'
        uses: actions/checkout@v5
        with:
          # full mode's snapshot-staleness check needs HEAD~1 -- same fix,
          # same reason as the (cut) `docs` and `deep` jobs' own comments.
          fetch-depth: 0

      - if: matrix.python-version == '3.13'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - if: matrix.python-version == '3.13'
        name: Install Qt runtime libraries
        # PyQt6 wheels ship Qt itself but still dlopen these system libs, even
        # under the offscreen platform plugin.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libfreetype6
          # glib was renamed libglib2.0-0 -> libglib2.0-0t64 in Ubuntu 24.04
          sudo apt-get install -y --no-install-recommends libglib2.0-0t64 \
            || sudo apt-get install -y --no-install-recommends libglib2.0-0

      - if: matrix.python-version == '3.13'
        name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - if: matrix.python-version == '3.13'
        name: Full gate (ruff + OFF + ON + DEEP + snapshot check)
        # CALLS THE LOCAL GATE, rather than reimplementing it -- same
        # reasoning as the (cut) `deep` job's own comment: two
        # implementations of a gate are two things that can drift.
        run: python tools/gate.py

      - if: matrix.python-version == '3.13'
        name: Validate v5 design corpus
        # independent of the suite, and not part of tools/gate.py: the schema
        # + invariant validator must accept every clean floorplanner-design
        # example (planc1.v5.json is the intentionally-corrupt fixture, so it
        # is not validated here)
        run: |
          python tools/validate_design.py examples/symmetricP1.json
          python tools/validate_design.py examples/site_demo.json

  windows:
    name: pytest (windows)
    runs-on: windows-latest
    # CUT (disabled, not deleted) -- 0105-ruling.md sec1/sec5: this job's
    # premise ("CI doesn't test the platform we run on") does not hold --
    # this IS Patrick's own machine's configuration (py3.13, Windows), which
    # is exactly what duplicates the local gate rather than covering
    # something it misses. Its one real value, a genuine Windows-only fault
    # (0064-report.md sec4's cp1252 console crash), is a real asymmetry, but
    # sec3/sec4's argument -- one agent, one machine, nothing to catch that
    # a clean-checkout run does not already catch locally -- still applies.
    if: false
    # DEFECT 27'S SECOND HALF. The deep half closed at 65c4c02; this is the
    # other one -- every job above is `ubuntu-latest`, and **Windows is this
    # project's primary development and use platform**. The register's own
    # wording: the severity of a Windows-only fault does not drop with the repro
    # environment, only the audience that sees it. Until this job existed,
    # nothing automated had ever run the suite on the platform the app is
    # actually used on.
    #
    # ONE PYTHON VERSION ON PURPOSE. The Linux matrix already covers the 3.10
    # floor and the 3.13 development version; what is missing here is the
    # PLATFORM, not another interpreter. A second Windows entry would double the
    # slowest job in the workflow to re-test something already tested.
    #
    # No Qt system libraries: the PyQt6 wheels are self-contained on Windows,
    # which is exactly why the Linux jobs need six apt packages and this one
    # needs none.
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # perf excluded for the same reason as everywhere else (P3.8's
        # flap ruling): a wall-clock ratio on a shared runner has two
        # indistinguishable causes.
        run: python -m pytest -ra -m "not perf"

      - name: Run tests with --verify-design (P1.6 shadow mode)
        env:
          FP_VERIFY_DESIGN: "1"
        run: python -m pytest -ra -m "not perf"

  deep:
    # CUT (disabled, not deleted) -- 0105-ruling.md sec5: redundant now, not
    # wrong -- the surviving `test` job (py3.13) calls the bare full gate,
    # which runs OFF, ON and DEEP together (the same three passes this job
    # ran alone), so a separate deep-only job re-tests what that job already
    # covers. 267 CI runs measured (2026-07-20, when this workflow began,
    # through today): this job went RED 37 times and every one was
    # `Docs-Snapshot: RED` with `Gate-DEEP` itself reporting OK -- zero
    # instances of DEEP catching an invariant fault OFF/ON did not already
    # report. Full receipt: 0106-report.md.
    if: false
    # DEFECT 27, FIRST HALF (P3.8). Until now CI ran only the CHEAP TWELVE
    # invariants (FP_VERIFY_DESIGN=1), so I5b, I11 and I14 -- the O(n^2) three,
    # and the two that caught the real corruption in planc1.json -- were guarded
    # by nothing but whoever remembered to run the deep gate by hand.
    #
    # It could not have been added before now: under `deep` a violation used to
    # ABORT the process (defect 26), so this job would have been red-by-design.
    # Defect 26's boundary guard is what made it possible; defect 28's fixes are
    # what made it reliable; and P3.8's perf exclusion is what keeps it
    # deterministic on a shared runner instead of importing the flap class.
    #
    # SINGLE py3.13 LEG, deliberately: the deep set is pure-Python invariant
    # checking over the same document the matrix job already exercises on both
    # versions, so a second leg would roughly double the slowest job in CI to
    # re-test version-independent arithmetic. Adding "3.10" to a matrix here is
    # a one-line change if that ever stops being true.
    #
    # The WINDOWS half of defect 27 stays open as its own task: the app's
    # primary platform is Windows and the abort that started all this was
    # Windows-only, so it is desirable -- but it is not merge-blocking.
    name: pytest deep invariants (py3.13)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          # This job runs gate.py --deep, which includes the Docs-Snapshot
          # check (D78, handoff 0027/0028) on every trigger EXCEPT
          # `pull_request` (0042-ruling.md skips it there -- see the `docs`
          # job's comment above). On `push`, that check still needs to
          # resolve HEAD~1, and the default depth of 1 gives a single commit
          # with no parent at all -- confirmed on CI itself, not reasoned
          # about. Same fix, same reason as the `docs` job above.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libfreetype6
          sudo apt-get install -y --no-install-recommends libglib2.0-0t64 \
            || sudo apt-get install -y --no-install-recommends libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Deep gate
        # CALLS THE LOCAL GATE, rather than reimplementing it. `--deep` sets
        # FP_VERIFY_DESIGN=deep, excludes the perf lane exactly as every other
        # mode does, and reconciles its own census against --collect-only, so
        # CI and the developer's gate are ONE instrument. Two implementations
        # of a gate are two things that can drift.
        run: python tools/gate.py --deep
