<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1240" width="1020" height="1240" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d5ba6"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a3d"/>
    </marker>
  </defs>
  <style>
    .lbl  { font-size:12px;   fill:#000; paint-order:stroke; stroke:#fff; stroke-width:4px; stroke-linejoin:round; }
    .rlbl { font-size:12px;   fill:#14532d; font-weight:700; paint-order:stroke; stroke:#fff; stroke-width:4px; stroke-linejoin:round; }
    .cmd  { font-size:13.5px; fill:#000; font-weight:700; font-family:Consolas,Menlo,monospace;
            paint-order:stroke; stroke:#fff; stroke-width:4.5px; stroke-linejoin:round; }
    .note { font-size:10.5px; fill:#444; paint-order:stroke; stroke:#fff; stroke-width:3.5px; stroke-linejoin:round; }
    .hdr  { font-size:13px; font-weight:700; fill:#111; }
    .mdl  { font-size:10px; font-weight:700; fill:#2a4a7a; }
    .sub  { font-size:9.5px; fill:#666; }
    .band { font-size:11px; font-weight:700; fill:#333; letter-spacing:.4px; }
    .msg  { stroke:#000; stroke-width:1.6; fill:none; }
    .rd   { stroke:#1f7a3d; stroke-width:2.1; fill:none; }
    .rep  { stroke:#555; stroke-width:1.4; stroke-dasharray:6 4; fill:none; }
    .loc  { stroke:#7d5ba6; stroke-width:1.6; fill:none; }
    .ttl  { font-size:15px; font-weight:700; fill:#111; }
    .grp  { font-size:10.5px; font-weight:700; fill:#666; letter-spacing:.5px; }
  </style>
  <rect width="1020" height="1240" fill="#fff"/>

  <text x="30" y="22" class="ttl">FloorPlanner — the channel. Black = a message or a write · <tspan fill="#1f7a3d">GREEN = the record being READ BACK</tspan></text>

  <rect x="33"  y="32" width="144" height="46" rx="7" fill="#eef2fb" stroke="#8fa8d8"/>
  <text x="105" y="48" class="hdr" text-anchor="middle">PATRICK</text>
  <text x="105" y="61" class="mdl" text-anchor="middle">human</text>
  <text x="105" y="73" class="sub" text-anchor="middle">everything he ever types</text>

  <rect x="269" y="32" width="152" height="46" rx="7" fill="#eef6ee" stroke="#8fbf92"/>
  <text x="345" y="48" class="hdr" text-anchor="middle">COWORK</text>
  <text x="345" y="61" class="mdl" text-anchor="middle">Claude Opus 5</text>
  <text x="345" y="73" class="sub" text-anchor="middle">writes ‑ruling.md only</text>

  <rect x="512" y="32" width="176" height="46" rx="7" fill="#f4f0e4" stroke="#c3ae74"/>
  <text x="600" y="48" class="hdr" text-anchor="middle">docs/handoff/ + git</text>
  <text x="600" y="61" class="mdl" text-anchor="middle">the record</text>
  <text x="600" y="73" class="sub" text-anchor="middle">append‑only · numbered</text>

  <rect x="774" y="32" width="168" height="46" rx="7" fill="#fbeeee" stroke="#d69494"/>
  <text x="858" y="48" class="hdr" text-anchor="middle">CODE</text>
  <text x="858" y="61" class="mdl" text-anchor="middle">Claude Opus 5 · 1M ctx</text>
  <text x="858" y="73" class="sub" text-anchor="middle">Sonnet for mechanical phases</text>

  <g stroke="#bbb" stroke-dasharray="4 5">
    <line x1="105" y1="82" x2="105" y2="1104"/>
    <line x1="345" y1="82" x2="345" y2="1104"/>
    <line x1="600" y1="82" x2="600" y2="1104"/>
    <line x1="858" y1="82" x2="858" y2="1104"/>
  </g>

  <line x1="105" y1="106" x2="345" y2="106" class="msg" marker-end="url(#ah)"/>
  <text x="225" y="100" class="lbl" text-anchor="middle">a question, or a check result</text>

  <line x1="600" y1="132" x2="345" y2="132" class="rd" marker-end="url(#ahr)"/>
  <text x="472" y="126" class="rlbl" text-anchor="middle">READS: handoff · snapshot · agreement · register · git · the source</text>

  <line x1="345" y1="158" x2="600" y2="158" class="msg" marker-end="url(#ah)"/>
  <text x="472" y="152" class="lbl" text-anchor="middle">writes NNNN‑ruling.md</text>

  <line x1="345" y1="184" x2="105" y2="184" class="rep" marker-end="url(#ahg)"/>
  <text x="225" y="178" class="note" text-anchor="middle">“say: 0018 is up”</text>

  <line x1="105" y1="216" x2="858" y2="216" class="msg" marker-end="url(#ah)"/>
  <text x="360" y="209" class="cmd" text-anchor="middle">0018 is up</text>
  <text x="646" y="210" class="note" text-anchor="middle">= a new file exists, go read it. Nothing else.</text>

  <line x1="858" y1="244" x2="600" y2="244" class="msg" marker-end="url(#ah)"/>
  <text x="729" y="238" class="lbl" text-anchor="middle">builds · gates · commits the work + NNNN‑report.md</text>

  <!-- MEANWHILE -->
  <rect x="58" y="258" width="884" height="72" rx="6" fill="#fffbe9" stroke="#e0c86a"/>
  <text x="70" y="274" class="band">MEANWHILE — Code is still on 0018. Rulings queue; they never interrupt.</text>
  <line x1="105" y1="296" x2="345" y2="296" class="msg" marker-end="url(#ah)"/>
  <text x="225" y="290" class="lbl" text-anchor="middle">more questions</text>
  <line x1="345" y1="322" x2="600" y2="322" class="msg" marker-end="url(#ah)"/>
  <text x="472" y="316" class="lbl" text-anchor="middle">writes 0019, 0020 …</text>

  <!-- CODE RECOVERY -->
  <rect x="58" y="342" width="884" height="198" rx="6" fill="#f6f0fa" stroke="#a68cc4"/>
  <text x="70" y="359" class="band">IF CODE’S CONTEXT FILLS — say it EARLY, while the gate is still green. Code sees this before you do, via /context.</text>

  <line x1="105" y1="384" x2="858" y2="384" class="msg" marker-end="url(#ah)"/>
  <text x="330" y="377" class="cmd" text-anchor="middle">checkpoint</text>
  <text x="646" y="378" class="note" text-anchor="middle">frees NO tokens — it makes the state durable</text>

  <line x1="858" y1="412" x2="600" y2="412" class="msg" marker-end="url(#ah)"/>
  <text x="729" y="406" class="lbl" text-anchor="middle">commit at green · NNNN‑report.md · re‑cut §0/§1</text>
  <text x="300" y="406" class="note" text-anchor="middle">a RED gate blocks every commit — including this report</text>

  <path d="M105,428 h52 v22 h-52" class="loc" marker-end="url(#ahp)"/>
  <text x="168" y="443" class="cmd" fill="#5d3f80">/clear</text>
  <text x="258" y="443" class="note">typed to your own terminal, not to Code. NOT /compact — a summary is</text>
  <text x="258" y="456" class="note">a second version of a record you already have on disk.</text>

  <line x1="105" y1="482" x2="858" y2="482" class="msg" marker-end="url(#ah)"/>
  <text x="400" y="475" class="cmd" text-anchor="middle">resume from 0021 — and 0022 is up</text>
  <text x="400" y="498" class="note" text-anchor="middle">ONE LINE, TWO JOBS: “resume from” = where you were · “is up” = what landed while you were down.</text>

  <line x1="600" y1="522" x2="858" y2="522" class="rd" marker-end="url(#ahr)"/>
  <text x="729" y="516" class="rlbl" text-anchor="middle">READS its own report + every ruling since</text>
  <text x="300" y="518" class="note" text-anchor="middle">→ rejoins the flow, current</text>

  <!-- AMBER STOP -->
  <line x1="858" y1="566" x2="105" y2="566" class="rep" marker-end="url(#ahg)"/>
  <text x="468" y="560" class="lbl" text-anchor="middle">one short paragraph + the file number — PR is open, and STOPS</text>
  <text x="468" y="581" class="note" text-anchor="middle">GREEN would have merged itself. You are never asked for a PR.</text>

  <!-- REVIEW -->
  <rect x="58" y="598" width="884" height="118" rx="6" fill="#eefaf1" stroke="#1f7a3d"/>
  <text x="70" y="615" class="band">THE REVIEW — this is where Cowork actually works, and it reads the TREE, not the report’s account of itself</text>

  <line x1="600" y1="640" x2="345" y2="640" class="rd" marker-end="url(#ahr)"/>
  <text x="472" y="634" class="rlbl" text-anchor="middle">READS the report · git log · status · diff · the source · the gate</text>

  <text x="795" y="636" class="note" text-anchor="middle">this read is what caught: a boat trailer that was never</text>
  <text x="795" y="650" class="note" text-anchor="middle">in the checked scene · artwork that was never redrawn ·</text>
  <text x="795" y="664" class="note" text-anchor="middle">a control that could only ever return one answer</text>

  <line x1="345" y1="678" x2="600" y2="678" class="msg" marker-end="url(#ah)"/>
  <text x="472" y="672" class="lbl" text-anchor="middle">writes NNNN‑ruling.md — accept, refuse, or demand a measurement</text>

  <line x1="345" y1="704" x2="105" y2="704" class="rep" marker-end="url(#ahg)"/>
  <text x="225" y="698" class="note" text-anchor="middle">“say: 0022 is up”</text>

  <path d="M105,732 h46 v24 h-46" class="msg" marker-end="url(#ah)"/>
  <text x="162" y="747" class="lbl">you run the check the ruling named</text>

  <!-- ALT -->
  <rect x="58" y="770" width="884" height="158" rx="6" fill="#f6f8fc" stroke="#a9b8d4"/>
  <text x="70" y="787" class="band">THEN ONE OF TWO THINGS — and they go to different places</text>

  <line x1="105" y1="812" x2="858" y2="812" class="msg" marker-end="url(#ah)"/>
  <text x="350" y="805" class="cmd" text-anchor="middle">0018 check passed: &lt;what you saw&gt;</text>
  <line x1="858" y1="838" x2="600" y2="838" class="msg" marker-end="url(#ah)"/>
  <text x="729" y="832" class="lbl" text-anchor="middle">merges · records you VERBATIM · re‑cuts</text>
  <text x="285" y="834" class="note" text-anchor="middle">a passing check CLOSES A LOOP</text>

  <line x1="58" y1="856" x2="942" y2="856" stroke="#a9b8d4" stroke-dasharray="5 4"/>

  <line x1="105" y1="882" x2="345" y2="882" class="msg" marker-end="url(#ah)"/>
  <text x="238" y="875" class="cmd" text-anchor="middle">0018 check failed: …</text>
  <line x1="600" y1="908" x2="345" y2="908" class="rd" marker-end="url(#ahr)"/>
  <text x="472" y="902" class="rlbl" text-anchor="middle">READS again, then rules → back to the top</text>
  <text x="790" y="892" class="note" text-anchor="middle">a failing check OPENS A RECORD — never to Code,</text>
  <text x="790" y="907" class="note" text-anchor="middle">which would fix what it thinks you meant. “Unsure” goes here.</text>

  <!-- COWORK RECOVERY -->
  <rect x="58" y="944" width="884" height="152" rx="6" fill="#f4faf4" stroke="#8fbf92"/>
  <text x="70" y="961" class="band">COWORK HAS NO /clear AND NO /compact — and needs none. Its only volatile state is a decision not yet written.</text>

  <line x1="105" y1="984" x2="345" y2="984" class="msg" marker-end="url(#ah)"/>
  <text x="225" y="977" class="cmd" text-anchor="middle">anything unfiled?</text>
  <text x="225" y="999" class="note" text-anchor="middle">the reviewer’s checkpoint — a QUESTION, not a command</text>
  <text x="700" y="977" class="note" text-anchor="middle">ask before a gap, before ending, or after a long exchange with</text>
  <text x="700" y="991" class="note" text-anchor="middle">no file written. A good answer is “nothing — it’s all in 00NN.”</text>

  <line x1="345" y1="1016" x2="600" y2="1016" class="msg" marker-end="url(#ah)"/>
  <text x="472" y="1010" class="lbl" text-anchor="middle">writes whatever it was holding</text>

  <line x1="58" y1="1032" x2="942" y2="1032" stroke="#8fbf92" stroke-dasharray="5 4"/>

  <line x1="105" y1="1056" x2="345" y2="1056" class="msg" marker-end="url(#ah)"/>
  <text x="225" y="1049" class="cmd" text-anchor="middle">where do things stand?</text>
  <text x="225" y="1071" class="note" text-anchor="middle">in a brand‑new session — no handover owed</text>

  <line x1="600" y1="1088" x2="345" y2="1088" class="rd" marker-end="url(#ahr)"/>
  <text x="472" y="1082" class="rlbl" text-anchor="middle">READS itself back to current — one turn, measured</text>
  <text x="790" y="1064" class="note" text-anchor="middle">THE WHOLE REASON THE REVIEWER IS DISPOSABLE:</text>
  <text x="790" y="1079" class="note" text-anchor="middle">its memory is the repository, and the repository is still there.</text>

  <!-- legend -->
  <rect x="58" y="1112" width="884" height="100" rx="6" fill="#fafafa" stroke="#ccc"/>
  <text x="74" y="1131" class="band">EVERYTHING YOU EVER TYPE, BY RECIPIENT</text>

  <text x="74"  y="1152" class="grp">TO CODE</text>
  <text x="164" y="1152" class="cmd">NNNN is up</text>
  <text x="290" y="1152" class="cmd">NNNN check passed: …</text>
  <text x="500" y="1152" class="cmd">checkpoint</text>
  <text x="620" y="1152" class="cmd">resume from NNNN — and MMMM is up</text>

  <text x="74"  y="1176" class="grp">TO COWORK</text>
  <text x="164" y="1176" class="cmd">NNNN check failed: …</text>
  <text x="374" y="1176" class="cmd">anything unfiled?</text>
  <text x="540" y="1176" class="cmd">where do things stand?</text>

  <text x="74"  y="1198" class="grp">TO YOUR TERMINAL</text>
  <text x="215" y="1198" class="cmd" fill="#5d3f80">/clear</text>
  <text x="285" y="1198" class="note">Never needed: “open a PR” · “commit that” · “run the gate” · pasting a report to Cowork · pasting a ruling to Code.</text>
</svg>
