<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1075" width="1020" height="1075" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d5ba6"/>
    </marker>
  </defs>
  <style>
    .lbl  { font-size:12px;   fill:#000; paint-order:stroke; stroke:#fff; stroke-width:4px; stroke-linejoin:round; }
    .cmd  { font-size:13.5px; fill:#000; font-weight:700; font-family:Consolas,Menlo,monospace;
            paint-order:stroke; stroke:#fff; stroke-width:4.5px; stroke-linejoin:round; }
    .note { font-size:10.5px; fill:#444; paint-order:stroke; stroke:#fff; stroke-width:3.5px; stroke-linejoin:round; }
    .hdr  { font-size:13px; font-weight:700; fill:#111; }
    .mdl  { font-size:10px; font-weight:700; fill:#2a4a7a; }
    .sub  { font-size:9.5px; fill:#666; }
    .band { font-size:11px; font-weight:700; fill:#333; letter-spacing:.4px; }
    .msg  { stroke:#000; stroke-width:1.6; fill:none; }
    .rep  { stroke:#555; stroke-width:1.4; stroke-dasharray:6 4; fill:none; }
    .loc  { stroke:#7d5ba6; stroke-width:1.6; fill:none; }
    .ttl  { font-size:15px; font-weight:700; fill:#111; }
    .grp  { font-size:10.5px; font-weight:700; fill:#666; letter-spacing:.5px; }
  </style>
  <rect width="1020" height="1075" fill="#fff"/>

  <text x="30" y="24" class="ttl">FloorPlanner — the channel, with context recovery on both sides</text>

  <rect x="33"  y="34" width="144" height="46" rx="7" fill="#eef2fb" stroke="#8fa8d8"/>
  <text x="105" y="50" class="hdr" text-anchor="middle">PATRICK</text>
  <text x="105" y="63" class="mdl" text-anchor="middle">human</text>
  <text x="105" y="75" class="sub" text-anchor="middle">everything he ever types</text>

  <rect x="269" y="34" width="152" height="46" rx="7" fill="#eef6ee" stroke="#8fbf92"/>
  <text x="345" y="50" class="hdr" text-anchor="middle">COWORK</text>
  <text x="345" y="63" class="mdl" text-anchor="middle">Claude Opus 5</text>
  <text x="345" y="75" class="sub" text-anchor="middle">writes ‑ruling.md only</text>

  <rect x="512" y="34" width="176" height="46" rx="7" fill="#f4f0e4" stroke="#c3ae74"/>
  <text x="600" y="50" class="hdr" text-anchor="middle">docs/handoff/ + git</text>
  <text x="600" y="63" class="mdl" text-anchor="middle">the record</text>
  <text x="600" y="75" class="sub" text-anchor="middle">append‑only · numbered</text>

  <rect x="774" y="34" width="168" height="46" rx="7" fill="#fbeeee" stroke="#d69494"/>
  <text x="858" y="50" class="hdr" text-anchor="middle">CODE</text>
  <text x="858" y="63" class="mdl" text-anchor="middle">Claude Opus 5 · 1M ctx</text>
  <text x="858" y="75" class="sub" text-anchor="middle">Sonnet for mechanical phases</text>

  <g stroke="#bbb" stroke-dasharray="4 5">
    <line x1="105" y1="84" x2="105" y2="946"/>
    <line x1="345" y1="84" x2="345" y2="946"/>
    <line x1="600" y1="84" x2="600" y2="946"/>
    <line x1="858" y1="84" x2="858" y2="946"/>
  </g>

  <line x1="105" y1="106" x2="345" y2="106" class="msg" marker-end="url(#ah)"/>
  <text x="225" y="100" class="lbl" text-anchor="middle">a question, or a check result</text>

  <line x1="345" y1="134" x2="600" y2="134" class="msg" marker-end="url(#ah)"/>
  <text x="472" y="128" class="lbl" text-anchor="middle">reads the record → writes NNNN‑ruling.md</text>

  <line x1="345" y1="160" x2="105" y2="160" class="rep" marker-end="url(#ahg)"/>
  <text x="225" y="154" class="note" text-anchor="middle">“say: 0018 is up”</text>

  <line x1="105" y1="192" x2="858" y2="192" class="msg" marker-end="url(#ah)"/>
  <text x="360" y="185" class="cmd" text-anchor="middle">0018 is up</text>
  <text x="640" y="186" class="note" text-anchor="middle">= a new file exists, go read it. Nothing else.</text>

  <line x1="858" y1="220" x2="600" y2="220" class="msg" marker-end="url(#ah)"/>
  <text x="729" y="214" class="lbl" text-anchor="middle">reads it · builds · gates · commits</text>

  <!-- MEANWHILE -->
  <rect x="58" y="234" width="884" height="76" rx="6" fill="#fffbe9" stroke="#e0c86a"/>
  <text x="70" y="250" class="band">MEANWHILE — Code is still on 0018. Rulings queue; they never interrupt.</text>
  <line x1="105" y1="272" x2="345" y2="272" class="msg" marker-end="url(#ah)"/>
  <text x="225" y="266" class="lbl" text-anchor="middle">more questions</text>
  <line x1="345" y1="300" x2="600" y2="300" class="msg" marker-end="url(#ah)"/>
  <text x="472" y="294" class="lbl" text-anchor="middle">writes 0019, 0020 …</text>

  <!-- CODE RECOVERY -->
  <rect x="58" y="322" width="884" height="200" rx="6" fill="#f6f0fa" stroke="#a68cc4"/>
  <text x="70" y="339" class="band">IF CODE’S CONTEXT FILLS — say it EARLY, while the gate is still green. Code sees this before you do, via /context.</text>

  <line x1="105" y1="364" x2="858" y2="364" class="msg" marker-end="url(#ah)"/>
  <text x="330" y="357" class="cmd" text-anchor="middle">checkpoint</text>
  <text x="646" y="358" class="note" text-anchor="middle">frees NO tokens — it makes the state durable</text>

  <line x1="858" y1="392" x2="600" y2="392" class="msg" marker-end="url(#ah)"/>
  <text x="729" y="386" class="lbl" text-anchor="middle">commit at green · NNNN‑report.md · re‑cut §0/§1</text>
  <text x="300" y="386" class="note" text-anchor="middle">a RED gate blocks every commit — including this report</text>

  <path d="M105,408 h52 v22 h-52" class="loc" marker-end="url(#ahp)"/>
  <text x="168" y="423" class="cmd" fill="#5d3f80">/clear</text>
  <text x="258" y="423" class="note">a Claude Code command, typed to your own terminal — not a message to Code.</text>
  <text x="258" y="436" class="note">NOT /compact: a summary is a second version of a record you already have.</text>

  <line x1="105" y1="462" x2="858" y2="462" class="msg" marker-end="url(#ah)"/>
  <text x="400" y="455" class="cmd" text-anchor="middle">resume from 0021 — and 0022 is up</text>
  <text x="400" y="478" class="note" text-anchor="middle">ONE LINE, TWO JOBS: “resume from” = where you were · “is up” = what landed while you were down.</text>
  <text x="400" y="491" class="note" text-anchor="middle">Cowork kept ruling through the outage, so a bare “resume” would rejoin the flow already behind.</text>

  <line x1="858" y1="506" x2="600" y2="506" class="msg" marker-end="url(#ah)"/>
  <text x="729" y="500" class="lbl" text-anchor="middle">reads that report + every ruling since</text>
  <path d="M600,512 C 530,524 490,524 430,514" class="rep" marker-end="url(#ahg)"/>
  <text x="320" y="512" class="note" text-anchor="middle">→ rejoins the flow, current</text>

  <!-- AMBER STOP -->
  <line x1="858" y1="546" x2="105" y2="546" class="rep" marker-end="url(#ahg)"/>
  <text x="468" y="540" class="lbl" text-anchor="middle">one short paragraph + the file number — PR is open, and STOPS</text>
  <text x="468" y="561" class="note" text-anchor="middle">GREEN would have merged itself. You are never asked for a PR.</text>

  <path d="M105,578 h46 v24 h-46" class="msg" marker-end="url(#ah)"/>
  <text x="162" y="593" class="lbl">you run the check the ruling named</text>

  <!-- ALT -->
  <rect x="58" y="616" width="884" height="160" rx="6" fill="#f6f8fc" stroke="#a9b8d4"/>
  <text x="70" y="633" class="band">THEN ONE OF TWO THINGS — and they go to different places</text>

  <line x1="105" y1="660" x2="858" y2="660" class="msg" marker-end="url(#ah)"/>
  <text x="350" y="653" class="cmd" text-anchor="middle">0018 check passed: &lt;what you saw&gt;</text>
  <line x1="858" y1="686" x2="600" y2="686" class="msg" marker-end="url(#ah)"/>
  <text x="729" y="680" class="lbl" text-anchor="middle">merges · records you VERBATIM · re‑cuts</text>
  <text x="285" y="682" class="note" text-anchor="middle">a passing check CLOSES A LOOP</text>

  <line x1="58" y1="704" x2="942" y2="704" stroke="#a9b8d4" stroke-dasharray="5 4"/>

  <line x1="105" y1="730" x2="345" y2="730" class="msg" marker-end="url(#ah)"/>
  <text x="238" y="723" class="cmd" text-anchor="middle">0018 check failed: …</text>
  <line x1="345" y1="756" x2="600" y2="756" class="msg" marker-end="url(#ah)"/>
  <text x="472" y="750" class="lbl" text-anchor="middle">writes the next ruling → back to the top</text>
  <text x="775" y="740" class="note" text-anchor="middle">a failing check OPENS A RECORD — never to Code,</text>
  <text x="775" y="755" class="note" text-anchor="middle">which would fix what it thinks you meant. “Unsure” goes here.</text>

  <!-- COWORK RECOVERY -->
  <rect x="58" y="790" width="884" height="156" rx="6" fill="#f4faf4" stroke="#8fbf92"/>
  <text x="70" y="807" class="band">COWORK HAS NO /clear AND NO /compact — and needs none. Its only volatile state is a decision not yet written.</text>

  <line x1="105" y1="830" x2="345" y2="830" class="msg" marker-end="url(#ah)"/>
  <text x="225" y="823" class="cmd" text-anchor="middle">anything unfiled?</text>
  <text x="225" y="845" class="note" text-anchor="middle">the reviewer’s checkpoint — a QUESTION, not a command</text>
  <text x="700" y="823" class="note" text-anchor="middle">ask before a gap, before ending, or after a long exchange</text>
  <text x="700" y="838" class="note" text-anchor="middle">with no file written. A good answer is “nothing — it’s all in 00NN.”</text>

  <line x1="345" y1="862" x2="600" y2="862" class="msg" marker-end="url(#ah)"/>
  <text x="472" y="856" class="lbl" text-anchor="middle">writes whatever it was holding</text>

  <line x1="58" y1="878" x2="942" y2="878" stroke="#8fbf92" stroke-dasharray="5 4"/>

  <line x1="105" y1="902" x2="345" y2="902" class="msg" marker-end="url(#ah)"/>
  <text x="225" y="895" class="cmd" text-anchor="middle">where do things stand?</text>
  <text x="225" y="917" class="note" text-anchor="middle">in a brand‑new session — no handover owed</text>
  <line x1="345" y1="934" x2="600" y2="934" class="msg" marker-end="url(#ah)"/>
  <text x="472" y="928" class="lbl" text-anchor="middle">handoff (highest first) · agreement · snapshot · register</text>
  <text x="775" y="905" class="note" text-anchor="middle">the project instructions carry the reading order,</text>
  <text x="775" y="920" class="note" text-anchor="middle">so one sentence is the whole recovery. Measured: one turn.</text>

  <!-- legend -->
  <rect x="58" y="962" width="884" height="100" rx="6" fill="#fafafa" stroke="#ccc"/>
  <text x="74" y="981" class="band">EVERYTHING YOU EVER TYPE, BY RECIPIENT</text>

  <text x="74"  y="1002" class="grp">TO CODE</text>
  <text x="164" y="1002" class="cmd">NNNN is up</text>
  <text x="290" y="1002" class="cmd">NNNN check passed: …</text>
  <text x="500" y="1002" class="cmd">checkpoint</text>
  <text x="620" y="1002" class="cmd">resume from NNNN — and MMMM is up</text>

  <text x="74"  y="1026" class="grp">TO COWORK</text>
  <text x="164" y="1026" class="cmd">NNNN check failed: …</text>
  <text x="374" y="1026" class="cmd">anything unfiled?</text>
  <text x="540" y="1026" class="cmd">where do things stand?</text>

  <text x="74"  y="1048" class="grp">TO YOUR TERMINAL</text>
  <text x="215" y="1048" class="cmd" fill="#5d3f80">/clear</text>
  <text x="285" y="1048" class="note">Never needed: “open a PR” · “commit that” · “run the gate” · pasting a report to Cowork · pasting a ruling to Code.</text>
</svg>
