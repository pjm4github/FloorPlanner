[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floorplanner"
version = "1.0"                       # source of truth: APP_VERSION in floorplanner/config.py
description = "A 2D architectural floor-plan editor written in Python with PyQt6."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Patrick Moran" }]
dependencies = [
    "PyQt6==6.11.0",
    "PyQt6-sip==13.11.1",
    "numpy>=1.24",                    # fp_extract.py + Import-from-image
]

[project.optional-dependencies]
# The 3D viewer (floorplanner/viewer/fp3d.py).  Optional on purpose: the editor runs
# without it, and CI has no OpenGL surface, so the base install and all four
# CI jobs are unchanged.  Install with:
#     pip install -e ".[viewer]"        or   pip install -r requirements-viewer.txt
viewer = [
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
]

[project.urls]
Homepage = "https://github.com/pjm4github/FloorPlanner"

[project.scripts]
floorplanner = "floorplanner.app:main"
fp3d = "floorplanner.viewer.fp3d:main"

[tool.setuptools]
# the app package (+ the design subpackage), plus the top-level shim and
# headless tools as modules
packages = ["floorplanner", "floorplanner.design", "floorplanner.viewer"]
py-modules = ["FloorPlanner", "fp_macro", "fp_extract"]

[tool.setuptools.package-data]
# bundled fonts + artwork live under assets/ at the repo root; an editable
# install (pip install -e .) keeps the layout so config.py resolves them.
floorplanner = []
"floorplanner.design" = ["design-schema.v5.json"]   # packaged v5 JSON Schema
